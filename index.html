<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>M-sh31</title>
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
<style>
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overscroll-behavior-y: contain;
    overflow: hidden;
  }

  body {
    display: flex;
    flex-direction: column;
    justify-content: center;
    align-items: center;
    background: radial-gradient(circle at center, #1a1a2e 0%, #0f0f1a 100%);
    font-family: 'Tajawal', sans-serif;
    color: white;
    position: relative;
  }

  /* ===== 5. خلفية النجوم المتحركة ===== */
  .stars-bg {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    z-index: 0;
    pointer-events: none;
    overflow: hidden;
  }

  .star {
    position: absolute;
    background-color: #fff;
    border-radius: 50%;
    opacity: 0.5;
    animation: twinkle linear infinite;
  }

  @keyframes twinkle {
    0%, 100% { opacity: 0.1; transform: scale(1); }
    50% { opacity: 0.8; transform: scale(1.3); }
  }

  /* ===== النافذة المنبثقة ===== */
  .popup-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(0, 0, 0, 0.75);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 1000;
    backdrop-filter: blur(8px);
    transition: opacity 0.6s ease;
  }

  .popup-box {
    background: rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(15px);
    border: 1px solid rgba(255, 255, 255, 0.2);
    padding: 35px 25px;
    border-radius: 25px;
    box-shadow: 0 25px 50px rgba(0,0,0,0.5);
    text-align: center;
    width: 75%;
    max-width: 320px;
    transform: translateY(30px);
    animation: slideUp 0.7s ease forwards;
    position: relative;
    z-index: 10;
  }

  .popup-box p {
    font-size: 26px;
    font-weight: 900;
    color: #ffffff;
    margin: 0 0 25px 0;
    line-height: 1.5;
    letter-spacing: 1px;
    text-shadow: 0 2px 10px rgba(0,0,0,0.3);
  }

  .popup-box button {
    position: relative;
    padding: 12px 35px;
    background: linear-gradient(135deg, #4CAF50, #2E7D32);
    color: white;
    border: none;
    border-radius: 50px;
    font-size: 17px;
    font-weight: 700;
    font-family: 'Tajawal', sans-serif;
    cursor: pointer;
    overflow: hidden;
    transition: transform 0.4s ease, padding 0.4s ease, font-size 0.4s ease;
    box-shadow: 0 10px 25px rgba(76, 175, 80, 0.4);
    z-index: 10;
  }

  .shake {
    animation: shakeAnim 0.4s ease-in-out;
  }

  @keyframes shakeAnim {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-5px); }
    75% { transform: translateX(5px); }
  }

  /* ===== صورة الصرخة المؤقتة ===== */
  .scream-image {
    position: fixed;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%) scale(0.5);
    width: 90vw;
    height: 90vw;
    max-width: 500px;
    max-height: 500px;
    border-radius: 20px;
    box-shadow: 0 0 100px rgba(255, 0, 0, 0.8);
    z-index: 2000;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.15s ease, transform 0.15s ease;
    object-fit: cover;
  }

  .scream-image.show {
    opacity: 1;
    transform: translate(-50%, -50%) scale(1);
    pointer-events: auto;
  }

  /* ===== 10. شاشة Glitch ===== */
  .glitch-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: #000;
    z-index: 3000;
    display: none;
    justify-content: center;
    align-items: center;
    overflow: hidden;
  }

  .glitch-overlay.show {
    display: flex;
  }

  .glitch-overlay::before,
  .glitch-overlay::after {
    content: '';
    position: absolute;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background: #000;
  }

  .glitch-overlay::before {
    animation: glitchAnim1 0.3s infinite linear alternate-reverse;
    background: rgba(255, 0, 0, 0.1);
    left: 2px;
  }

  .glitch-overlay::after {
    animation: glitchAnim2 0.2s infinite linear alternate-reverse;
    background: rgba(0, 255, 255, 0.1);
    left: -2px;
  }

  @keyframes glitchAnim1 {
    0% { clip-path: inset(20% 0 30% 0); transform: translateX(-5px); }
    20% { clip-path: inset(60% 0 10% 0); transform: translateX(5px); }
    40% { clip-path: inset(10% 0 80% 0); transform: translateX(-3px); }
    60% { clip-path: inset(40% 0 40% 0); transform: translateX(3px); }
    80% { clip-path: inset(80% 0 5% 0); transform: translateX(-5px); }
    100% { clip-path: inset(30% 0 50% 0); transform: translateX(5px); }
  }

  @keyframes glitchAnim2 {
    0% { clip-path: inset(50% 0 20% 0); transform: translateX(5px); }
    25% { clip-path: inset(10% 0 70% 0); transform: translateX(-5px); }
    50% { clip-path: inset(70% 0 10% 0); transform: translateX(3px); }
    75% { clip-path: inset(30% 0 40% 0); transform: translateX(-3px); }
    100% { clip-path: inset(20% 0 60% 0); transform: translateX(5px); }
  }

  .glitch-text {
    color: #fff;
    font-size: 24px;
    font-weight: 900;
    font-family: 'Tajawal', sans-serif;
    z-index: 1;
    text-shadow: 2px 0 #ff0000, -2px 0 #00ffff;
    animation: glitchText 0.1s infinite;
  }

  @keyframes glitchText {
    0% { transform: translate(0); }
    20% { transform: translate(-2px, 2px); }
    40% { transform: translate(-2px, -2px); }
    60% { transform: translate(2px, 2px); }
    80% { transform: translate(2px, -2px); }
    100% { transform: translate(0); }
  }

  /* ===== الصورة النهائية ===== */
  .image-container {
    display: none;
    opacity: 0;
    transform: scale(0.9) translateY(30px);
    transition: all 1.2s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    text-align: center;
    position: relative;
    z-index: 1;
    width: 100%;
    margin-top: -60px;
  }

  .image-container.show {
    display: block;
    opacity: 1;
    transform: scale(1) translateY(0);
  }

  .top-text {
    font-size: 30px;
    font-weight: 900;
    color: #fff;
    margin-bottom: 20px;
    text-shadow: 0 0 10px rgba(255, 255, 255, 0.5), 0 0 20px rgba(76, 175, 80, 0.5);
    letter-spacing: 2px;
    animation: pulse 2s infinite;
  }

  .image-container img {
    width: 85vw;
    height: auto;
    max-height: 70vh;
    object-fit: contain;
    display: block;
    margin: 0 auto;
    border-radius: 25px;
    border: 3px solid rgba(0, 0, 0, 0.8);
    box-shadow: 
      0 0 0 5px rgba(0, 0, 0, 0.4),
      0 20px 50px rgba(0,0,0,0.7),
      0 0 40px rgba(0, 0, 0, 0.9);
  }

  /* ===== عداد الزوار ===== */
  .visitor-counter {
    position: fixed;
    bottom: 15px;
    left: 15px;
    font-size: 13px;
    color: rgba(255, 255, 255, 0.7);
    font-weight: 400;
    z-index: 999;
    background: rgba(0, 0, 0, 0.3);
    padding: 5px 12px;
    border-radius: 20px;
    border: 1px solid rgba(255, 255, 255, 0.1);
    backdrop-filter: blur(5px);
    display: flex;
    align-items: center;
    gap: 5px;
  }

  @keyframes slideUp {
    from { opacity: 0; transform: translateY(50px); }
    to { opacity: 1; transform: translateY(0); }
  }

  @keyframes pulse {
    0% { transform: scale(1); }
    50% { transform: scale(1.05); }
    100% { transform: scale(1); }
  }

  .popup-overlay.hidden {
    opacity: 0;
    pointer-events: none;
  }
</style>
</head>
<body>

<!-- ===== 5. خلفية النجوم ===== -->
<div class="stars-bg" id="starsBg"></div>

<!-- ===== 10. شاشة Glitch ===== -->
<div class="glitch-overlay" id="glitchOverlay">
  <div class="glitch-text">جاري التحميل...</div>
</div>

<!-- ===== الصوتيات ===== -->
<audio id="doorKnock" preload="auto">
  <source src="knock.mp3" type="audio/mpeg">
</audio>

<audio id="screamSound" preload="auto">
  <source src="scream.mp3" type="audio/mpeg">
</audio>

<!-- عداد الزوار -->
<div class="visitor-counter">
    <span>عدد الزوار: <span id="counterValue">0</span></span>
</div>

<!-- الصورة النهائية -->
<div class="image-container" id="imageContainer">
  <div class="top-text">( ارجع ارجع كبس )</div>
  <img src="logoo.jpg" alt="Logo">
</div>

<!-- صورة الصرخة المؤقتة (GIF) -->
<img src="scream.gif" alt="Scream" class="scream-image" id="screamImage">

<!-- النافذة المنبثقة -->
<div class="popup-overlay" id="myPopup">
  <div class="popup-box" id="popupBox">
    <p>جـعـلـك الـحـيـه 🐍</p>
    <button id="okButton">حسناً</button>
  </div>
</div>

<script>
  // ============================================
  // 5. توليد النجوم تلقائياً
  // ============================================
  const starsBg = document.getElementById('starsBg');
  const starCount = 80; // عدد النجوم

  for (let i = 0; i < starCount; i++) {
    const star = document.createElement('div');
    star.classList.add('star');
    
    // حجم عشوائي
    const size = Math.random() * 3 + 1;
    star.style.width = size + 'px';
    star.style.height = size + 'px';
    
    // مكان عشوائي
    star.style.left = Math.random() * 100 + '%';
    star.style.top = Math.random() * 100 + '%';
    
    // مدة ومدة تأخير عشوائية
    star.style.animationDuration = (Math.random() * 3 + 2) + 's';
    star.style.animationDelay = (Math.random() * 5) + 's';
    
    starsBg.appendChild(star);
  }

  // ============================================
  // 1. زر "حسناً" الذي يهرب (3 مرات) + 7 (يتصغر)
  // ============================================
  const okButton = document.getElementById('okButton');
  const popupBox = document.getElementById('popupBox');
  
  let escapeCount = 0;
  const maxEscapes = 3;
  let isEscaping = false;
  let lastEscapeTime = 0;

  function escapeButton() {
    const now = Date.now();
    if (isEscaping || escapeCount >= maxEscapes || (now - lastEscapeTime) < 1500) return;
    
    isEscaping = true;
    lastEscapeTime = now;
    escapeCount++;

    const randomX = (Math.random() - 0.5) * 300;
    const randomY = (Math.random() - 0.5) * 300;

    // تصغير الزر تدريجياً مع كل هروب
    const scaleFactor = 1 - (escapeCount * 0.1); // 1 -> 0.9 -> 0.8 -> 0.7

    okButton.style.transition = 'transform 0.4s ease-out';
    okButton.style.transform = `translate(${randomX}px, ${randomY}px) scale(${scaleFactor})`;

    setTimeout(() => {
      okButton.style.transition = 'none';
      isEscaping = false;
      
      // إذا وصل للحد الأقصى، أعده لمكانه الأصلي بحجمه الطبيعي
      if (escapeCount >= maxEscapes) {
        okButton.style.transition = 'transform 0.6s ease';
        okButton.style.transform = 'translate(0, 0) scale(1)';
      }
    }, 1500);
  }

  okButton.addEventListener('mouseover', function() {
    if (!isEscaping && escapeCount < maxEscapes) escapeButton();
  });

  okButton.addEventListener('touchstart', function(e) {
    if (!isEscaping && escapeCount < maxEscapes) {
      e.preventDefault();
      escapeButton();
    }
  });

  // ============================================
  // 2. عند الضغط النهائي
  // ============================================
  let isPlaying = false;

  okButton.addEventListener('click', function() {
    if (isPlaying) return;
    isPlaying = true;

    popupBox.classList.add('shake');

    setTimeout(() => {
      popupBox.classList.remove('shake');

      // رفع صوت دق الباب إلى 200%
      const doorKnock = document.getElementById('doorKnock');
      doorKnock.volume = 2.0;
      doorKnock.currentTime = 0;
      doorKnock.play().catch(e => console.log('صوت دق الباب محجوب:', e));

      setTimeout(() => {
        doorKnock.pause();
        doorKnock.currentTime = 0;
        showScream();
      }, 4000);

    }, 500);
  });

  // ============================================
  // 3. عرض الصرخة (3 ثوانٍ)
  // ============================================
  function showScream() {
    const screamImage = document.getElementById('screamImage');
    const screamSound = document.getElementById('screamSound');

    screamImage.classList.add('show');
    screamSound.volume = 1.0;
    screamSound.currentTime = 0;
    screamSound.play().catch(e => console.log('الصوت محجوب:', e));

    setTimeout(() => {
      screamImage.classList.remove('show');
      screamSound.pause();
      screamSound.currentTime = 0;
      
      // ===== 10. شاشة Glitch لمدة ثانية =====
      showGlitch();
      
    }, 3000);
  }

  // ============================================
  // 10. عرض شاشة Glitch ثم الصورة النهائية
  // ============================================
  function showGlitch() {
    const glitchOverlay = document.getElementById('glitchOverlay');
    glitchOverlay.classList.add('show');

    // بعد ثانية واحدة، أخفِ الـ Glitch وأظهر الصورة النهائية
    setTimeout(() => {
      glitchOverlay.classList.remove('show');
      
      const popup = document.getElementById('myPopup');
      popup.classList.add('hidden');
      
      const imageContainer = document.getElementById('imageContainer');
      imageContainer.classList.add('show');

      startCrazyCounter();

      setTimeout(() => { popup.style.display = 'none'; }, 600);
    }, 1000);
  }

  // ============================================
  // 4. عداد الزوار (أرقام إنجليزية)
  // ============================================
  function startCrazyCounter() {
    const counterEl = document.getElementById('counterValue');
    let count = 0;
    const interval = setInterval(() => {
      count += Math.floor(Math.random() * 1500) + 500;
      if (count >= 999999) {
        count = 999999;
        counterEl.innerText = count.toLocaleString('en-US');
        clearInterval(interval);
      } else {
        counterEl.innerText = count.toLocaleString('en-US');
      }
    }, 100);
  }
</script>

</body>
</html>
