<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>M-sh31</title>
<style>
  /* تنسيق الصفحة بشكل عام */
  body {
    margin: 0;
    padding: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    min-height: 100vh;
    background: linear-gradient(135deg, #1e1e2f 0%, #2a2a40 100%); /* خلفية داكنة أنيقة */
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    overflow: hidden;
  }

  /* تنسيق حاوية الصورة */
  .image-container {
    display: none; /* مخفية في البداية */
    opacity: 0;
    transform: scale(0.8);
    transition: all 1s cubic-bezier(0.175, 0.885, 0.32, 1.275); /* تأثير ظهور مرن */
    text-align: center;
  }

  .image-container img {
    max-width: 85vw; /* حجم كبير يناسب الشاشات */
    max-height: 80vh;
    border-radius: 20px;
    box-shadow: 0 15px 35px rgba(0,0,0,0.5);
    border: 3px solid rgba(255, 255, 255, 0.1);
  }

  /* تنسيق النافذة المنبثقة (Popup) */
  .popup-overlay {
    position: fixed;
    top: 0;
    left: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(0, 0, 0, 0.85); /* خلفية معتمة جداً لإبراز الرسالة */
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 1000;
    backdrop-filter: blur(5px); /* تأثير ضبابي خلف النافذة */
    transition: opacity 0.5s ease;
  }

  .popup-box {
    background: linear-gradient(145deg, #ffffff, #f0f0f0);
    padding: 40px 30px;
    border-radius: 25px;
    box-shadow: 0 20px 50px rgba(0,0,0,0.5);
    text-align: center;
    width: 85%;
    max-width: 400px;
    transform: translateY(20px);
    animation: slideUp 0.6s ease forwards;
  }

  /* تنسيق النص داخل النافذة */
  .popup-box p {
    font-size: 26px;
    font-weight: 900;
    color: #1a1a1a;
    margin: 0 0 30px 0;
    line-height: 1.6;
    letter-spacing: 1px;
    text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
  }

  /* تنسيق الزر */
  .popup-box button {
    padding: 14px 40px;
    background: linear-gradient(135deg, #4CAF50, #2E7D32);
    color: white;
    border: none;
    border-radius: 50px;
    font-size: 18px;
    font-weight: bold;
    cursor: pointer;
    transition: all 0.3s ease;
    box-shadow: 0 8px 20px rgba(76, 175, 80, 0.4);
  }

  .popup-box button:hover {
    transform: translateY(-3px);
    box-shadow: 0 12px 25px rgba(76, 175, 80, 0.6);
  }

  .popup-box button:active {
    transform: translateY(1px);
  }

  /* تأثيرات الحركة */
  @keyframes slideUp {
    from { opacity: 0; transform: translateY(40px); }
    to { opacity: 1; transform: translateY(0); }
  }

  /* تنسيقات عند إخفاء النافذة */
  .popup-overlay.hidden {
    opacity: 0;
    pointer-events: none;
  }

  .image-container.show {
    display: block;
    opacity: 1;
    transform: scale(1);
  }
</style>
</head>
<body>

<!-- حاوية الصورة (مخفية في البداية) -->
<div class="image-container" id="imageContainer">
  <img src="logoo.jpg" alt="Logo">
</div>

<!-- النافذة المنبثقة (تظهر أولاً) -->
<div class="popup-overlay" id="myPopup">
  <div class="popup-box">
    <p>جعلك الحيه ماعندنا رابط</p>
    <button onclick="showImage()">حسناً</button>
  </div>
</div>

<script>
  function showImage() {
    // إخفاء النافذة المنبثقة
    var popup = document.getElementById("myPopup");
    popup.classList.add("hidden");

    // إظهار الصورة
    var imageContainer = document.getElementById("imageContainer");
    imageContainer.classList.add("show");

    // إزالة النافذة من الصفحة تماماً بعد انتهاء تأثير الإخفاء
    setTimeout(function() {
      popup.style.display = "none";
    }, 500);
  }
</script>

</body>
</html>
